<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#4f46e5" stroke-width="4" stroke-opacity="0.35" />

  <!-- Shield Base -->
  <g transform="translate(0, -10)">
    <path d="M 256 70 
             C 330 70 400 95 400 95 
             C 400 240 340 340 256 390 
             C 172 340 112 240 112 95 
             C 112 95 182 70 256 70 Z" 
          fill="url(#indigoGrad)" 
          opacity="0.25" 
          stroke="url(#goldGrad)" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Inner Shield Accent -->
    <path d="M 256 94 
             C 318 94 374 114 374 114 
             C 374 232 324 316 256 360 
             C 188 316 138 232 138 114 
             C 138 114 194 94 256 94 Z" 
          fill="#0f172a" 
          opacity="0.85" />

    <!-- Financial Bar Chart Inside Shield -->
    <rect x="180" y="240" width="30" height="70" rx="6" fill="url(#goldGrad)" />
    <rect x="226" y="195" width="30" height="115" rx="6" fill="url(#indigoGrad)" />
    <rect x="272" y="155" width="30" height="155" rx="6" fill="url(#emeraldGrad)" />

    <!-- Upward Trend Line -->
    <path d="M 175 255 L 235 200 L 290 145 L 340 120" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glow)" />
    
    <!-- Trend Arrowhead -->
    <polygon points="345,108 348,135 325,124" fill="#fbbf24" />

    <!-- Rupee / CA Symbol Accent -->
    <circle cx="256" cy="335" r="22" fill="url(#goldGrad)" />
    <text x="256" y="343" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0f172a" text-anchor="middle">₹</text>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="4" text-anchor="middle">VIRTUAL CFO</text>
  <text x="256" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#fbbf24" letter-spacing="6" text-anchor="middle">EXECUTIVE SUITE</text>
</svg>
